name = "CDIxx config file"

InputImages =
{
  common= {
    Pattern="img";
    Intensity="../../misc/bing-ai-drawing.png";
    Phase="../../misc/R-C.png";
    restart="recon.bin";
  };
  pupil= {
    Pattern="pupil_intensity.png";
    Intensity="image.bin";
    Phase="einstein.bmp";
    restart="pupilrecon.bin";
  };
};

Job =
{
//These are float types, dot is needed, be careful
//lengths are in micron (1e-6 meters)
  oversampling = 1.; // over sampling ratio
  oversampling_spt = 3.; // over sampling ratio
  lambda = 632.8e-3;  //wave length in micron
  d = 50e3;  // distance between CCD and sample in micron, controls fresnel phase
  dpupil =12.6e3; //pupil - sample distance
  pupilSize = 229;
  pixelsize  = 19.5; // pixel size in micron
  beamspotsize = 972; // sample size in micron
  outputDir = "out/"; // a slash in the end is vital!
  //distFile = "scan_30.txt";
  exposure = 0.01; // control the pattern intensity, could be tuned to match the experiment
  exposurepupil = 0.03; // control the pattern intensity, could be tuned to match the experiment
  costheta = 1.;
//These are integers:
  verbose = 3;
  beamStopSize = 5;
  nIter = 1000;
  zernikeIter = 0;
  stepSize = 250.; //threshold @50: 3x3 scan
  saveVideoEveryIter = 3;
  nIterpupil = 1000;
  noiseLevel = 100;
  noiseLevel_pupil = 0;
  positionUncertainty = 2.;
//These are bool types
  mPIE=false;
  online = True;
  simCCDbit = True;  //Simulate integerization of 16bit CCD
  //isFresnel = True;  //Set to true if you are not using lenses
//  useBS=True; // Beamstop is added if set to true
  doIteration = True;  // Run reconstruction if set to true
//  restart=True; // common.restart is used for reconstruction starting point if set to true
};
