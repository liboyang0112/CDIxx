name = "CDIxx config file"

InputImages = 
{
  default= {
    //Pattern="pg/single0.png";
    Pattern="hene_pattern.bin";
    Intensity="benchmark_intensity.png";
    //Pattern="data.tiff";
    Phase="benchmark_phase.png";
    restart="recon.bin";
  };
  pupil= {
    Pattern="gratings.bin";
    Intensity="image.bin";
    //Phase="/home/boyang/SharedNTFS/images/ptycho/ptycho_Visible/benchmark_phase.png";
    restart="pupilrecon.bin";
  };
};

Job = 
{
//These are float types, dot is needed, be careful
//lengths are in micron (1e-6 meters)
  oversampling = 1.; // over sampling ratio
  oversampling_spt = 3.; // over sampling ratio
  lambda = 632.8e-3;  //wave length in micron
  d = 40e3;  // distance between CCD and sample in micron, controls fresnel phase
  dpupil = 8e3; //pupil - sample distance
  pupilSize = 750.;
  //dpupil = 2.;
  pixelsize = 6.5; // pixel size in micron
  beamspotsize = 972.; // sample size in micron
  outputDir = "out/";
  //distFile = "scan_30.txt";
  exposure = 0.1; // control the pattern intensity, could be tuned to match the experiment
  exposurepupil = 0.03; // control the pattern intensity, could be tuned to match the experiment
  costheta = 1.;
  positionUncertainty = 0.;
//These are integers:
  verbose = 0;
  beamStopSize = 5;
  nIter = 1600;
  zernikeIter = 1600;
  stepSize = 255; //threshold @50: 3x3 scan
  saveVideoEveryIter = 4;
  nIterpupil = 1000;
  noiseLevel = 20;
  noiseLevel_pupil = 20;
  computeErrorEveryIter = 3;
  L1Norm=True;
//These are bool types
  //online = True;
  mPIE = 4000;
//  phaseModulation = True; // default.Phase is used to modulate image if set to true
  //runSim = True; // default.Intensity is used to simulate the diffraction pattern if set to true.
                 // Otherwise, default.Pattern is used to reconstruct sample
  simCCDbit = True;  //Simulate integerization of 16bit CCD
  cancelFresnel = True;
  isFresnel = False;  //Set to true if you are not using lenses
//  useBS=True; // Beamstop is added if set to true
  doIteration = True;  // Run reconstruction if set to true
//  restart=True; // default.restart is used for reconstruction starting point if set to true
};
